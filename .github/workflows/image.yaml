name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      embed_ui:
        description: "Embed web UI into binary (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # minimal: default (no Python/Node) — published as :vX.Y.Z, :latest, etc.
        # full:    ENABLE_FULL_SKILLS=true (Python, Node, pandoc, github-cli, skill deps)
        #         — published with -full suffix on every tag.
        variant:
          - name: minimal
            suffix: ""
            build_args: ""
          - name: full
            suffix: "-full"
            build_args: "ENABLE_FULL_SKILLS=true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (variant: ${{ matrix.variant.name }})"

      # QEMU intentionally omitted: target cluster is amd64-only. Building
      # only the native platform avoids the ~16-minute QEMU-emulated arm64
      # Go compile (was ~6.5x slower than native amd64 on this codebase).
      - uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Suffix is applied to every generated tag (incl. :latest).
          # variant=minimal -> :v3.11.3, :latest
          # variant=full    -> :v3.11.3-full, :latest-full
          flavor: |
            suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || (github.ref_type == 'tag' && !contains(github.ref, '-')) }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope cache per variant so minimal/full don't thrash each other.
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            ENABLE_EMBEDUI=${{ inputs.embed_ui || 'true' }}
            ${{ matrix.variant.build_args }}

      - name: Summary
        run: |
          {
            echo "## Image published — variant \`${{ matrix.variant.name }}\`"
            echo ""
            echo "**Registry:** ${{ env.IMAGE }}"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sandbox:
    name: Build sandbox image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.11.1

      # Build the sandbox image locally (no push — sandbox isn't published).
      # Smoke test runs `sandbox-smoke.py` which exercises Pillow native libs
      # that have failed in production traces (019e62ff).
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64
          push: false
          load: true
          tags: goclaw-sandbox:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Smoke test sandbox runtime
        run: docker run --rm goclaw-sandbox:ci python3 /usr/local/bin/sandbox-smoke.py
