[project]
name = "vieneu-sidecar"
version = "0.1.0"
description = "In-pod HTTP daemon wrapping VieNeu-TTS for goclaw"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "vieneu>=2.7.0",
    "soundfile>=0.12",
    "python-multipart>=0.0.9",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
